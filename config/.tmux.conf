###
### いろいろ
###

# Esc キー押下後の待ち時間をなくす（vim で Esc の反応が良くなる）
set -sg escape-time 0

# ウィンドウのインデックスを1から始める
set -g base-index 1

# ペインのインデックスを1から始める
setw -g pane-base-index 1

# ウィンドウを閉じたら番号を詰める
set -g renumber-windows on

# ウィンドウ履歴の最大行数
set -g history-limit 200000

# フォーカスイベントを有効化（vim の autoread が効くようになる）
set -g focus-events on

###
### キーバインド設定
###

# | でペインを縦に分割する（現在のディレクトリを引き継ぐ）
bind | split-window -h -c "#{pane_current_path}"

# - でペインを横に分割する（現在のディレクトリを引き継ぐ）
bind - split-window -v -c "#{pane_current_path}"

# 設定ファイルをリロード
bind r source-file ~/.tmux.conf \; display "[tmux] .tmux.conf was reloaded."

###
### マウス設定
###

set -g mouse on

###
### 外観
###

# tmux 内の TERM（tmux-256color が現在の推奨値）
set -g default-terminal "tmux-256color"

# 外側の端末が 24bit カラーに対応していれば使う（tmux 3.2 以降）
set -as terminal-features ",xterm-256color:RGB"

# tmux 2.9 で *-fg / *-bg / *-attr は廃止され *-style に統合された

# ステータスバーの色
set -g status-style fg=white,bg=black

# ウィンドウリストの色
setw -g window-status-style fg=cyan,bg=default,dim

# アクティブなウィンドウを目立たせる
setw -g window-status-current-style fg=white,bg=red,bright

# ペインボーダーの色
set -g pane-border-style fg=green,bg=black

# アクティブなペインを目立たせる
set -g pane-active-border-style fg=white,bg=yellow

# コマンドラインの色
set -g message-style fg=white,bg=black,bright
